name: SSH Inspect Remote Layout
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Read-only remote directory discovery
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      HOSTINGER_SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HOSTINGER_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$HOSTINGER_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Discover document root (read-only)
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$HOSTINGER_SSH_PORT" -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            'D=silver-wolf-692661.hostingersite.com
             SD="$HOME/domains/$D/public_html"
             echo "== docroot full listing =="
             ls -la "$SD" | head -80
             echo "== stat key files =="
             stat -c "%y | %s bytes | %n" "$SD/.htaccess" "$SD/robots.php" "$SD/includes/header.php" 2>/dev/null
             echo "== any robots* under domain dir =="
             find "$HOME/domains/$D" -maxdepth 4 -name "robots*" -exec ls -la {} \; 2>/dev/null
             echo "== local tooling =="
             for c in curl wget php; do command -v $c >/dev/null 2>&1 && echo "have: $c"; done
             echo "== ORIGIN TRUTH via loopback https (bypass hcdn) =="
             if command -v curl >/dev/null 2>&1; then
               for u in robots.txt sitemap.xml ""; do
                 echo "--- GET https://127.0.0.1/$u (Host: $D, -k)"
                 curl -sk -m 15 -D /tmp/h.$$ -o /tmp/b.$$ -H "Host: $D" "https://127.0.0.1/$u" || { echo "curl failed: $?"; continue; }
                 head -6 /tmp/h.$$
                 echo "BODY>>$(head -c 900 /tmp/b.$$ | tr "\n" "|")<<"
                 echo "LOCALHOST-HITS: $(grep -c localhost /tmp/b.$$ 2>/dev/null || echo 0) | LIVE-HITS: $(grep -c silver-wolf-692661 /tmp/b.$$ 2>/dev/null || echo 0)"
                 echo
               done
               rm -f /tmp/h.$$ /tmp/b.$$
             else
               echo "no curl on server"
             fi
             echo "== SITE_URL + canonical lines from config (non-secret lines only) =="
             grep -n "SITE_URL\|DEBUG" "$SD/config/config.php" | head -10
             echo "== homepage canonical/og checks (loopback) =="
             curl -sk -m 15 -H "Host: $D" "https://127.0.0.1/" -o /tmp/hp.$$
             grep -o "<link rel=\"canonical\"[^>]*>" /tmp/hp.$$ | head -3
             grep -o "og:url[^>]*>" /tmp/hp.$$ | head -3
             echo "HOMEPAGE localhost-hits: $(grep -c localhost /tmp/hp.$$ || echo 0)"
             rm -f /tmp/hp.$$
             echo "== done =="'
