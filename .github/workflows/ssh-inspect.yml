name: SSH Inspect Remote Layout
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Read-only remote directory discovery
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      HOSTINGER_SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HOSTINGER_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$HOSTINGER_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Discover document root (read-only)
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$HOSTINGER_SSH_PORT" -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            'D=silver-wolf-692661.hostingersite.com
             SD="$HOME/domains/$D/public_html"
             echo "== docroot full listing =="
             ls -la "$SD" | head -80
             echo "== stat key files =="
             stat -c "%y | %s bytes | %n" "$SD/.htaccess" "$SD/robots.php" "$SD/includes/header.php" 2>/dev/null
             echo "== any robots* under domain dir =="
             find "$HOME/domains/$D" -maxdepth 4 -name "robots*" -exec ls -la {} \; 2>/dev/null
             echo "== local tooling =="
             for c in curl wget php; do command -v $c >/dev/null 2>&1 && echo "have: $c"; done
             echo "== ORIGIN TRUTH via loopback =="
             if command -v curl >/dev/null 2>&1; then
               for u in robots.txt robots.php; do
                 echo "--- GET http://127.0.0.1/$u (Host: $D)"
                 curl -s -m 10 -D /tmp/h.$$ -o /tmp/b.$$ -H "Host: $D" "http://127.0.0.1/$u" || { echo "curl failed: $?"; continue; }
                 head -15 /tmp/h.$$
                 echo "BODY>>$(head -c 400 /tmp/b.$$ | tr "\n" "|")<<"
                 echo
               done
               rm -f /tmp/h.$$ /tmp/b.$$
             else
               echo "no curl on server"
             fi
             echo "== public path FROM RUNNER =="
             curl -s -m 15 -D /tmp/ph.$$ -o /tmp/pb.$$ "https://$D/robots.txt" || echo "runner curl failed"
             head -20 /tmp/ph.$$
             echo "BODY>>$(head -c 400 /tmp/pb.$$ | tr "\n" "|")<<"
             rm -f /tmp/ph.$$ /tmp/pb.$$
             echo "== done =="'
