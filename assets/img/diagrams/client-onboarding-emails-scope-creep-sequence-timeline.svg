<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Manrope, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4fd8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="520" fill="#f7f6f2"/>

  <text x="450" y="45" text-anchor="middle" font-size="17" fill="#14161c">The six-email onboarding sequence</text>
  <text x="450" y="68" text-anchor="middle" font-size="15" fill="#5a6070">each email has one job, at one moment</text>

  <!-- Timeline axis -->
  <line x1="70" y1="260" x2="855" y2="260" stroke="#5a6070" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Node markers -->
  <circle cx="110" cy="260" r="9" fill="#1f4fd8"/>
  <circle cx="250" cy="260" r="9" fill="#1f4fd8"/>
  <circle cx="390" cy="260" r="9" fill="#e8402a"/>
  <circle cx="530" cy="260" r="9" fill="#1f4fd8"/>
  <circle cx="670" cy="260" r="9" fill="#1f4fd8"/>
  <circle cx="810" cy="260" r="9" fill="#1f4fd8"/>

  <!-- 1 above -->
  <line x1="110" y1="251" x2="110" y2="218" stroke="#1f4fd8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="45" y="130" width="130" height="82" rx="12" fill="#ffffff" stroke="#14161c" stroke-width="2"/>
  <text x="110" y="154" text-anchor="middle" font-size="15" fill="#1f4fd8">Email 1</text>
  <text x="110" y="175" text-anchor="middle" font-size="15" fill="#14161c">Scope</text>
  <text x="110" y="196" text-anchor="middle" font-size="15" fill="#5a6070">at kickoff</text>

  <!-- 2 below -->
  <line x1="250" y1="269" x2="250" y2="302" stroke="#1f4fd8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="185" y="306" width="130" height="82" rx="12" fill="#ffffff" stroke="#14161c" stroke-width="2"/>
  <text x="250" y="330" text-anchor="middle" font-size="15" fill="#1f4fd8">Email 2</text>
  <text x="250" y="351" text-anchor="middle" font-size="15" fill="#14161c">Boundaries</text>
  <text x="250" y="372" text-anchor="middle" font-size="15" fill="#5a6070">before work</text>

  <!-- 3 above (reactive) -->
  <line x1="390" y1="251" x2="390" y2="218" stroke="#e8402a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="325" y="130" width="130" height="82" rx="12" fill="#ffffff" stroke="#e8402a" stroke-width="2"/>
  <text x="390" y="154" text-anchor="middle" font-size="15" fill="#e8402a">Email 3</text>
  <text x="390" y="175" text-anchor="middle" font-size="15" fill="#14161c">Redirect</text>
  <text x="390" y="196" text-anchor="middle" font-size="15" fill="#5a6070">extra arrives</text>

  <!-- 4 below -->
  <line x1="530" y1="269" x2="530" y2="302" stroke="#1f4fd8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="465" y="306" width="130" height="82" rx="12" fill="#ffffff" stroke="#14161c" stroke-width="2"/>
  <text x="530" y="330" text-anchor="middle" font-size="15" fill="#1f4fd8">Email 4</text>
  <text x="530" y="351" text-anchor="middle" font-size="15" fill="#14161c">Check-in</text>
  <text x="530" y="372" text-anchor="middle" font-size="15" fill="#5a6070">midpoint</text>

  <!-- 5 above -->
  <line x1="670" y1="251" x2="670" y2="218" stroke="#1f4fd8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="605" y="130" width="130" height="82" rx="12" fill="#ffffff" stroke="#14161c" stroke-width="2"/>
  <text x="670" y="154" text-anchor="middle" font-size="15" fill="#1f4fd8">Email 5</text>
  <text x="670" y="175" text-anchor="middle" font-size="15" fill="#14161c">Sign-off</text>
  <text x="670" y="196" text-anchor="middle" font-size="15" fill="#5a6070">before delivery</text>

  <!-- 6 below -->
  <line x1="810" y1="269" x2="810" y2="302" stroke="#1f4fd8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="745" y="306" width="130" height="82" rx="12" fill="#ffffff" stroke="#14161c" stroke-width="2"/>
  <text x="810" y="330" text-anchor="middle" font-size="15" fill="#1f4fd8">Email 6</text>
  <text x="810" y="351" text-anchor="middle" font-size="15" fill="#14161c">Wrap-up</text>
  <text x="810" y="372" text-anchor="middle" font-size="15" fill="#5a6070">after handover</text>

  <text x="450" y="440" text-anchor="middle" font-size="15" fill="#5a6070">Email 3 is the only reactive one - and it works because Emails 1 and 2</text>
  <text x="450" y="462" text-anchor="middle" font-size="15" fill="#5a6070">already made &quot;change request&quot; a shared term.</text>
</svg>
