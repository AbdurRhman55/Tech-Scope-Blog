  <text x="40" y="406" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#e8402a">Row 4 holds 51% at W4 against row 1's 43% — compare the same column, never the totals.</text>
  <text x="40" y="430" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#14161c">Every cell is one division: active users in that period &#247; that row's cohort size.</text>

  <rect x="40" y="446" width="26" height="18" fill="#1f4fd8" fill-opacity="0.45" stroke="#d8d6cf" stroke-width="1"/>
  <text x="76" y="460" font-family="Manrope, Arial, sans-serif" font-size="14" fill="#5a6070">darker = higher retention</text>
  <rect x="330" y="446" width="26" height="18" fill="#eceae4" stroke="#d8d6cf" stroke-width="1"/>
  <text x="366" y="460" font-family="Manrope, Arial, sans-serif" font-size="14" fill="#5a6070">&#8212; = period the cohort has not reached yet (never read as zero)</text>

  <text x="40" y="492" font-family="Manrope, Arial, sans-serif" font-size="14" fill="#5a6070">Rows are fixed signup cohorts; columns are time since each cohort's own signup. Sample numbers invented for illustration.</text>
</svg>
