<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Manrope, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4fd8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8402a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="520" fill="#f7f6f2"/>

  <!-- Start -->
  <rect x="310" y="25" width="280" height="58" rx="12" fill="#ffffff" stroke="#14161c" stroke-width="2"/>
  <text x="450" y="60" text-anchor="middle" font-size="17" fill="#14161c">New request arrives</text>
  <line x1="450" y1="83" x2="450" y2="121" stroke="#1f4fd8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Decision 1 -->
  <rect x="310" y="125" width="280" height="64" rx="12" fill="#ffffff" stroke="#1f4fd8" stroke-width="2.5"/>
  <text x="450" y="153" text-anchor="middle" font-size="16" fill="#14161c">Inside the written</text>
  <text x="450" y="175" text-anchor="middle" font-size="16" fill="#14161c">scope we agreed?</text>

  <!-- Yes branch (left) -->
  <path d="M 310 157 L 250 157" stroke="#1f4fd8" stroke-width="2.5" fill="none"/>
  <text x="272" y="146" text-anchor="middle" font-size="16" fill="#1f4fd8">Yes</text>
  <line x1="250" y1="157" x2="250" y2="211" stroke="#1f4fd8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="130" y="215" width="240" height="70" rx="12" fill="#ffffff" stroke="#14161c" stroke-width="2"/>
  <text x="250" y="243" text-anchor="middle" font-size="16" fill="#14161c">Deliver within</text>
  <text x="250" y="266" text-anchor="middle" font-size="16" fill="#14161c">the current plan</text>

  <!-- No branch (right) -->
  <path d="M 590 157 L 680 157" stroke="#e8402a" stroke-width="2.5" fill="none" marker-end="url(#arrowRed)"/>
  <text x="632" y="146" text-anchor="middle" font-size="16" fill="#e8402a">No</text>
  <line x1="680" y1="157" x2="680" y2="211" stroke="#e8402a" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <rect x="560" y="215" width="240" height="70" rx="12" fill="#ffffff" stroke="#e8402a" stroke-width="2"/>
  <text x="680" y="243" text-anchor="middle" font-size="16" fill="#14161c">Change request:</text>
  <text x="680" y="266" text-anchor="middle" font-size="16" fill="#14161c">describe it, quote it</text>

  <!-- Decision 2 -->
  <line x1="680" y1="285" x2="680" y2="326" stroke="#1f4fd8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="560" y="330" width="240" height="64" rx="12" fill="#ffffff" stroke="#1f4fd8" stroke-width="2.5"/>
  <text x="680" y="369" text-anchor="middle" font-size="16" fill="#14161c">Client approves?</text>

  <!-- Approved -->
  <line x1="680" y1="394" x2="680" y2="421" stroke="#1f4fd8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="712" y="414" text-anchor="middle" font-size="16" fill="#1f4fd8">Yes</text>
  <rect x="560" y="425" width="240" height="64" rx="12" fill="#ffffff" stroke="#14161c" stroke-width="2"/>
  <text x="680" y="451" text-anchor="middle" font-size="15" fill="#14161c">New work scheduled with</text>
  <text x="680" y="472" text-anchor="middle" font-size="15" fill="#14161c">its own scope and date</text>

  <!-- Declined -->
  <path d="M 560 362 L 415 362" stroke="#e8402a" stroke-width="2.5" fill="none"/>
  <text x="500" y="351" text-anchor="middle" font-size="16" fill="#e8402a">No</text>
  <line x1="415" y1="362" x2="415" y2="421" stroke="#e8402a" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <rect x="300" y="425" width="230" height="64" rx="12" fill="#ffffff" stroke="#14161c" stroke-width="2"/>
  <text x="415" y="451" text-anchor="middle" font-size="15" fill="#14161c">Parked in the backlog;</text>
  <text x="415" y="472" text-anchor="middle" font-size="15" fill="#14161c">scope unchanged</text>

  <text x="450" y="510" text-anchor="middle" font-size="15" fill="#5a6070">Requests that skip this path are exactly how scope creep starts.</text>
</svg>
