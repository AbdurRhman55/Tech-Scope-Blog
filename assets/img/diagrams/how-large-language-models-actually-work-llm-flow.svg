<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">How an LLM produces one token</title>
  <desc id="desc">Prompt text is tokenized into token IDs, converted to embedding vectors, passed through attention layers, projected to one logit per vocabulary token, and sampled into the next token, which loops back into the input.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4fd8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="520" fill="#f7f6f2"/>
  <text x="40" y="52" font-family="Manrope, Arial, sans-serif" font-size="21" font-weight="700" fill="#14161c">One pass of the inference loop</text>

  <!-- Row 1 -->
  <rect x="40" y="100" width="200" height="76" rx="12" fill="#ffffff" stroke="#1f4fd8" stroke-width="2"/>
  <text x="140" y="132" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14161c">1 &#183; Prompt text</text>
  <text x="140" y="156" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="14" fill="#5a6070">the string you send</text>

  <rect x="330" y="100" width="200" height="76" rx="12" fill="#ffffff" stroke="#1f4fd8" stroke-width="2"/>
  <text x="430" y="132" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14161c">2 &#183; Tokenizer</text>
  <text x="430" y="156" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="14" fill="#5a6070">text &#8594; token IDs</text>

  <rect x="620" y="100" width="200" height="76" rx="12" fill="#ffffff" stroke="#1f4fd8" stroke-width="2"/>
  <text x="720" y="132" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14161c">3 &#183; Embeddings</text>
  <text x="720" y="156" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="14" fill="#5a6070">IDs &#8594; vectors</text>

  <line x1="240" y1="138" x2="322" y2="138" stroke="#1f4fd8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="138" x2="612" y2="138" stroke="#1f4fd8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Connector row 1 to row 2 -->
  <polyline points="720,176 720,212 140,212 140,242" fill="none" stroke="#1f4fd8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2 -->
  <rect x="40" y="250" width="200" height="76" rx="12" fill="#ffffff" stroke="#1f4fd8" stroke-width="2"/>
  <text x="140" y="282" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14161c">4 &#183; Attention layers</text>
  <text x="140" y="306" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="14" fill="#5a6070">mix info across positions</text>

  <rect x="330" y="250" width="200" height="76" rx="12" fill="#ffffff" stroke="#1f4fd8" stroke-width="2"/>
  <text x="430" y="282" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14161c">5 &#183; Logits</text>
  <text x="430" y="306" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="14" fill="#5a6070">one score per token</text>

  <rect x="620" y="250" width="200" height="76" rx="12" fill="#ffffff" stroke="#1f4fd8" stroke-width="2"/>
  <text x="720" y="282" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14161c">6 &#183; Sampler</text>
  <text x="720" y="306" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="14" fill="#5a6070">pick next token</text>

  <line x1="240" y1="288" x2="322" y2="288" stroke="#1f4fd8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="288" x2="612" y2="288" stroke="#1f4fd8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Loop back to the prompt -->
  <polyline points="720,326 720,420 20,420 20,138 32,138" fill="none" stroke="#e8402a" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/>
  <text x="370" y="408" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#5a6070">append the new token and run the loop again (stop on end token)</text>
</svg>
