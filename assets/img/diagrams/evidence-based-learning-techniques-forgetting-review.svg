<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Schematic forgetting curve with spaced reviews">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="60" y="52" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="700" fill="#14161c">Forgetting and spaced review (schematic)</text>
  <text x="60" y="78" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#5a6070">Shapes illustrate the mechanism, not measured data.</text>

  <!-- axes -->
  <line x1="90" y1="90" x2="90" y2="430" stroke="#14161c" stroke-width="2" marker-end="url(#arrowInk)"/>
  <line x1="90" y1="430" x2="840" y2="430" stroke="#14161c" stroke-width="2" marker-end="url(#arrowInk)"/>
  <text x="30" y="270" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#5a6070" transform="rotate(-90 30 270)" text-anchor="middle">retained memory</text>
  <text x="840" y="458" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#5a6070" text-anchor="end">time &#8594;</text>

  <!-- no-review curve -->
  <path d="M 110 110 C 170 250 260 330 400 368 C 540 400 690 412 820 417" fill="none" stroke="#e8402a" stroke-width="3"/>
  <text x="196" y="180" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#e8402a">no review: fast decay</text>

  <!-- with-review curve -->
  <path d="M 110 110 C 145 185 195 245 255 282 L 266 150" fill="none" stroke="#1f4fd8" stroke-width="3"/>
  <path d="M 266 150 C 305 210 355 245 425 272 L 438 172" fill="none" stroke="#1f4fd8" stroke-width="3"/>
  <path d="M 438 172 C 495 220 560 246 645 264 L 658 196" fill="none" stroke="#1f4fd8" stroke-width="3"/>
  <path d="M 658 196 C 720 228 780 238 820 242" fill="none" stroke="#1f4fd8" stroke-width="3"/>

  <!-- review markers -->
  <circle cx="266" cy="150" r="7" fill="#1f4fd8"/>
  <circle cx="438" cy="172" r="7" fill="#1f4fd8"/>
  <circle cx="658" cy="196" r="7" fill="#1f4fd8"/>
  <text x="248" y="132" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#14161c">review 1</text>
  <text x="420" y="154" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#14161c">review 2</text>
  <text x="640" y="178" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#14161c">review 3</text>
  <text x="300" y="330" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#1f4fd8">with spaced, effortful review: slower decay</text>

  <!-- legend -->
  <rect x="560" y="462" width="26" height="6" fill="#1f4fd8"/>
  <text x="594" y="471" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#5a6070">reviewed at growing intervals</text>
  <rect x="60" y="462" width="26" height="6" fill="#e8402a"/>
  <text x="94" y="471" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#5a6070">crammed once, never reviewed</text>

  <defs>
    <marker id="arrowInk" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#14161c"/>
    </marker>
  </defs>
</svg>
