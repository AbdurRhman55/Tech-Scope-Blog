<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">RAG vs fine-tuning decision flowchart</title>
  <desc id="desc">Flowchart: start from the goal to specialise an LLM. If answers depend on fresh or private facts, choose RAG. Otherwise, if the behaviour itself must change, fine-tune. Otherwise prompting with good context is enough.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4fd8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="520" fill="#f7f6f2"/>
  <text x="40" y="48" font-family="Manrope, Arial, sans-serif" font-size="21" font-weight="700" fill="#14161c">Choosing a specialisation path</text>

  <!-- Start -->
  <rect x="330" y="70" width="240" height="60" rx="12" fill="#ffffff" stroke="#14161c" stroke-width="2"/>
  <text x="450" y="106" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14161c">Goal: specialise an LLM</text>

  <!-- Decision 1 -->
  <rect x="300" y="170" width="300" height="64" rx="12" fill="#ffffff" stroke="#1f4fd8" stroke-width="2"/>
  <text x="450" y="196" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14161c">Do the answers depend on facts</text>
  <text x="450" y="216" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14161c">that change or stay private?</text>

  <line x1="450" y1="130" x2="450" y2="162" stroke="#1f4fd8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision 2 -->
  <rect x="300" y="300" width="300" height="64" rx="12" fill="#ffffff" stroke="#1f4fd8" stroke-width="2"/>
  <text x="450" y="326" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14161c">Does the behaviour itself need</text>
  <text x="450" y="346" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14161c">to change: tone, format, task?</text>

  <line x1="450" y1="234" x2="450" y2="292" stroke="#1f4fd8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="464" y="268" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" fill="#e8402a">NO</text>

  <!-- RAG branch (yes from decision 1) -->
  <polyline points="300,202 150,202 150,242" fill="none" stroke="#1f4fd8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="194" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" fill="#e8402a">YES</text>

  <rect x="50" y="250" width="200" height="70" rx="12" fill="#ffffff" stroke="#1f4fd8" stroke-width="2"/>
  <text x="150" y="278" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14161c">RAG</text>
  <text x="150" y="302" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="14" fill="#5a6070">retrieve facts at query time</text>

  <line x1="150" y1="320" x2="150" y2="362" stroke="#1f4fd8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="50" y="370" width="200" height="80" rx="12" fill="#ffffff" stroke="#14161c" stroke-width="2"/>
  <text x="150" y="402" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14161c">Update, cite, revoke</text>
  <text x="150" y="426" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="14" fill="#5a6070">without retraining</text>

  <!-- Fine-tuning branch (yes from decision 2) -->
  <polyline points="600,332 750,332 750,342" fill="none" stroke="#1f4fd8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="324" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" fill="#e8402a">YES</text>

  <rect x="650" y="350" width="200" height="70" rx="12" fill="#ffffff" stroke="#1f4fd8" stroke-width="2"/>
  <text x="750" y="378" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14161c">Fine-tuning</text>
  <text x="750" y="402" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="14" fill="#5a6070">teaches tone, format, style</text>

  <line x1="750" y1="420" x2="750" y2="447" stroke="#1f4fd8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="650" y="455" width="200" height="60" rx="12" fill="#ffffff" stroke="#14161c" stroke-width="2"/>
  <text x="750" y="481" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14161c">Needs example data</text>
  <text x="750" y="503" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="14" fill="#5a6070">and an evaluation set</text>

  <!-- Prompting fallback (no from decision 2) -->
  <line x1="450" y1="364" x2="450" y2="402" stroke="#1f4fd8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="464" y="388" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" fill="#e8402a">NO</text>

  <rect x="350" y="410" width="200" height="70" rx="12" fill="#ffffff" stroke="#14161c" stroke-width="2"/>
  <text x="450" y="438" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14161c">Prompting is enough</text>
  <text x="450" y="462" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="14" fill="#5a6070">fix the context first</text>
</svg>
