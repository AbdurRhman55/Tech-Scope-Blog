<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Diagram: a fleeting note becomes a literature note, which spawns linked atomic notes collected by a map-of-content note that inspires a new note">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="60" y="44" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="700" fill="#14161c">Capture to structure: one idea, one chain</text>
  <text x="60" y="70" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#5a6070">Each link carries a sentence explaining why the notes belong together.</text>

  <!-- fleeting note -->
  <rect x="70" y="100" width="200" height="60" rx="12" fill="#f7f6f2" stroke="#5a6070" stroke-width="2"/>
  <text x="86" y="124" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14161c">Fleeting note</text>
  <text x="86" y="146" font-family="Manrope, Arial, sans-serif" font-size="13" fill="#5a6070">captured in seconds</text>

  <!-- literature note -->
  <rect x="70" y="230" width="200" height="84" rx="12" fill="#ffffff" stroke="#14161c" stroke-width="2"/>
  <text x="86" y="256" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14161c">Literature note</text>
  <text x="86" y="278" font-family="Manrope, Arial, sans-serif" font-size="13" fill="#5a6070">author&#8217;s claim in your words,</text>
  <text x="86" y="296" font-family="Manrope, Arial, sans-serif" font-size="13" fill="#5a6070">plus the citation</text>

  <line x1="170" y1="162" x2="170" y2="226" stroke="#1f4fd8" stroke-width="2" marker-end="url(#zkArrow)"/>
  <text x="182" y="199" font-family="Manrope, Arial, sans-serif" font-size="13" fill="#5a6070">rewrite same day</text>

  <!-- atomic notes -->
  <rect x="380" y="110" width="260" height="64" rx="12" fill="#ffffff" stroke="#1f4fd8" stroke-width="2"/>
  <text x="396" y="136" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14161c">Index writes cost something</text>
  <text x="396" y="158" font-family="Manrope, Arial, sans-serif" font-size="12" fill="#5a6070">atomic note &#183; your words &#183; one claim</text>

  <rect x="380" y="210" width="260" height="64" rx="12" fill="#ffffff" stroke="#1f4fd8" stroke-width="2"/>
  <text x="396" y="236" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14161c">Choose indexes from queries</text>
  <text x="396" y="258" font-family="Manrope, Arial, sans-serif" font-size="12" fill="#5a6070">"the counterweight to write cost"</text>

  <rect x="380" y="310" width="260" height="64" rx="12" fill="#ffffff" stroke="#1f4fd8" stroke-width="2"/>
  <text x="396" y="336" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14161c">Composite index column order</text>
  <text x="396" y="358" font-family="Manrope, Arial, sans-serif" font-size="12" fill="#5a6070">"a consequence of query-first"</text>

  <path d="M 270 272 C 320 272 330 142 374 142" fill="none" stroke="#1f4fd8" stroke-width="2" marker-end="url(#zkArrow)"/>
  <text x="286" y="196" font-family="Manrope, Arial, sans-serif" font-size="13" fill="#5a6070">extract one idea</text>

  <line x1="430" y1="176" x2="430" y2="206" stroke="#14161c" stroke-width="2" marker-end="url(#zkInk)"/>
  <text x="444" y="196" font-family="Manrope, Arial, sans-serif" font-size="12" fill="#5a6070">"elaborates"</text>
  <line x1="500" y1="276" x2="500" y2="306" stroke="#14161c" stroke-width="2" marker-end="url(#zkInk)"/>
  <text x="514" y="296" font-family="Manrope, Arial, sans-serif" font-size="12" fill="#5a6070">"follows from"</text>

  <!-- map of content -->
  <rect x="710" y="180" width="150" height="110" rx="12" fill="#f7f6f2" stroke="#e8402a" stroke-width="2"/>
  <text x="726" y="206" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#e8402a">Map of content</text>
  <text x="726" y="230" font-family="Manrope, Arial, sans-serif" font-size="14" fill="#14161c">SQL performance</text>
  <text x="726" y="252" font-family="Manrope, Arial, sans-serif" font-size="12" fill="#5a6070">a themed index of</text>
  <text x="726" y="270" font-family="Manrope, Arial, sans-serif" font-size="12" fill="#5a6070">links, not a folder</text>

  <path d="M 640 150 L 706 194" fill="none" stroke="#5a6070" stroke-width="2" marker-end="url(#zkGrey)"/>
  <path d="M 640 242 L 706 232" fill="none" stroke="#5a6070" stroke-width="2" marker-end="url(#zkGrey)"/>
  <path d="M 640 342 L 706 272" fill="none" stroke="#5a6070" stroke-width="2" marker-end="url(#zkGrey)"/>

  <!-- next note -->
  <rect x="710" y="372" width="150" height="64" rx="12" fill="#ffffff" stroke="#14161c" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="726" y="398" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" fill="#14161c">Next note</text>
  <text x="726" y="418" font-family="Manrope, Arial, sans-serif" font-size="12" fill="#5a6070">arrives by link</text>

  <line x1="785" y1="292" x2="785" y2="368" stroke="#e8402a" stroke-width="2" marker-end="url(#zkRed)"/>
  <text x="798" y="334" font-family="Manrope, Arial, sans-serif" font-size="12" fill="#5a6070">inspires</text>

  <text x="70" y="480" font-family="Manrope, Arial, sans-serif" font-size="14" fill="#5a6070">Weekly habit: open one random old note, improve its title or links &#8212; the box re-teaches you what it contains.</text>

  <defs>
    <marker id="zkArrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1f4fd8"/>
    </marker>
    <marker id="zkInk" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#14161c"/>
    </marker>
    <marker id="zkGrey" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a6070"/>
    </marker>
    <marker id="zkRed" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e8402a"/>
    </marker>
  </defs>
</svg>
